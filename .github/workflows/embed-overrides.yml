# 埋め込み（docs/embed/）の除外設定を、目視確認ページから作った GitHub Issue で更新する。
# 流れ: docs/embed/review/ のボタン → Issue（作成者 netafull・タイトル [embed-overrides] …）→ このワークフローが
#       config/embed_overrides.json を更新 → build.py（Amazon は呼ばない）→ commit/push → Issue にコメントして close。
# Issue 本文はシェルに展開しない（scripts/apply_embed_overrides.py が GITHUB_EVENT_PATH から読む）。
# update.yml と同じ concurrency グループにして、同時に push しない。
name: embed-overrides

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.issue.user.login == 'netafull' && startsWith(github.event.issue.title, '[embed-overrides]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply overrides from issue
        id: apply
        run: python scripts/apply_embed_overrides.py
        env:
          EMBED_RESULT_FILE: ${{ runner.temp }}/embed_result.txt

      - name: Build docs
        id: build
        run: python3 build.py
        env:
          GA4_ID: ${{ vars.GA4_ID }}

      - name: Commit and push
        id: push
        run: |
          if [ -n "$(git status --porcelain config docs)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add config docs
            git commit -m "Embed overrides from #${{ github.event.issue.number }}"
            git pull --rebase
            git push
          else
            echo "変更なし"
          fi

      - name: Comment and close
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT_FILE: ${{ runner.temp }}/embed_result.txt
          OK: ${{ steps.apply.outcome == 'success' && steps.build.outcome == 'success' && steps.push.outcome == 'success' }}
        with:
          script: |
            const fs = require('fs');
            let detail = '';
            try { detail = fs.readFileSync(process.env.RESULT_FILE, 'utf8'); } catch (e) {}
            const ok = process.env.OK === 'true';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = ok
              ? `反映しました：${detail}\n\n反映先: https://shinkan.netaful.jp/embed/review/ （公開まで数分かかります）`
              : `反映できませんでした：${detail || 'ビルドまたは push の段階で失敗しました'}\n\n実行ログ: ${run}`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            if (ok) {
              await github.rest.issues.update({ ...context.repo, issue_number: context.issue.number, state: 'closed' });
            }
